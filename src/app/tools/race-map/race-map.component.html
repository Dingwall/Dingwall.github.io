<div #mapContainer style="width: 100%; height: 100vh;"></div>

<button
  *ngIf="geolocationStatus !== 'ready'"
  type="button"
  (click)="requestLocationAccess()"
  style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #0f172a; color: white; border: none; border-radius: 999px; padding: 12px 18px; font-weight: 700; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25);">
  Use my location
</button>
